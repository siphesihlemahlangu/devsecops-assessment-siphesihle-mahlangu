version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: secure-app
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
      - apparmor=unconfined
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    networks:
      - app-network

  # Security scanning service
  trivy-scanner:
    image: aquasec/trivy:latest
    container_name: security-scanner
    volumes:
      - ./reports:/reports
      - /var/run/docker.sock:/var/run/docker.sock
    command: >
      sh -c "trivy image --security-checks vuln,config,secret --exit-code 1 --format sarif --output /reports/scan-report.sarif secure-app:latest || echo 'Vulnerabilities found - check report'"
    depends_on:
      - app
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
    internal: false